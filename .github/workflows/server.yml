name: Server checks and binaries

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -count=1 ./...
      - name: Run binary smoke test
        working-directory: .
        run: ./tools/smoke-server.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build static Linux binary
        run: ./tools/build-server.sh "${{ matrix.arch }}"
      - name: Check executable and checksum
        run: |
          cd "build/server/linux-${{ matrix.arch }}"
          sha256sum --check SHA256SUMS
          file "voice-agent-server-linux-${{ matrix.arch }}"
      - name: Execute AMD64 binary
        if: matrix.arch == 'amd64'
        run: ./build/server/linux-amd64/voice-agent-server-linux-amd64 version
      - name: Upload binary and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: voice-agent-server-linux-${{ matrix.arch }}
          path: build/server/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
