name: AI Passport firmware

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Device host tests
        shell: bash
        run: ./tools/test-firmware-host.sh
      - name: Build and verify firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          ./tools/validate.sh --firmware
      - name: Upload verified image and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: voice-agent-terminal-esp32c3
          path: |
            build/Voice-Agent-Terminal-full.bin
            build/Voice-Agent-Terminal-full.bin.sha256
          if-no-files-found: error
          retention-days: 7
