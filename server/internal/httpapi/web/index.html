<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Voice Agent</title>
  <link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="会话">
      <div class="side-head">
        <div class="brand">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-name">Voice Agent</span>
        </div>
        <button id="close-sidebar" class="icon-button only-narrow" type="button" aria-label="收起会话列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <button id="new-chat" class="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>新对话</span>
        <kbd>Ctrl K</kbd>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="search" type="search" placeholder="搜索会话标题" autocomplete="off" spellcheck="false">
      </label>
      <nav id="session-list" class="session-list" aria-label="会话列表"></nav>
      <div class="side-foot">
        <div class="status-line">
          <span id="connection-dot" class="dot" aria-hidden="true"></span>
          <span id="connection" role="status">正在连接</span>
        </div>
        <div class="side-actions">
          <button id="device-logs" class="icon-button" type="button" aria-label="设备日志" title="设备诊断日志">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h7l4 4v12H7zM14 4v4h4M10 12h5M10 16h5"/></svg>
          </button>
          <button id="theme" class="icon-button" type="button" aria-label="切换主题" title="主题：跟随系统">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
          </button>
          <button id="sign-out" class="icon-button" type="button" aria-label="退出连接" title="退出连接" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <main class="main">
      <header class="topbar">
        <button id="open-sidebar" class="icon-button only-narrow" type="button" aria-label="打开会话列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="title">新对话</h1>
          <span id="title-state" class="pill" hidden></span>
        </div>
        <div class="topbar-actions">
          <button id="rename" class="icon-button" type="button" aria-label="重命名" title="重命名" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h4L19 9l-4-4L5 15z"/><path d="M13 7l4 4"/></svg>
          </button>
          <button id="delete" class="icon-button danger" type="button" aria-label="删除会话" title="删除会话" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
          </button>
        </div>
      </header>
      <section id="thread" class="thread" aria-live="polite">
        <div id="thread-inner" class="thread-inner"></div>
      </section>
      <div class="composer-area">
        <div id="live" class="live" role="status" hidden>
          <span class="live-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="live-text">设备正在录音</span>
        </div>
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="给 Hermes 发消息" aria-label="消息内容" spellcheck="false"></textarea>
          <div class="composer-row">
            <span id="draft-note" class="draft-note" hidden></span>
            <button id="send" class="send" type="submit" aria-label="发送" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </form>
        <p class="hint">Enter 发送 · Shift+Enter 换行 · 设备上的语音草稿会同步到这里</p>
      </div>
    </main>
  </div>

  <section id="auth" class="auth" hidden aria-labelledby="auth-title">
    <form id="auth-form" class="auth-card">
      <span class="mark large" aria-hidden="true"><i></i><i></i><i></i></span>
      <h2 id="auth-title">连接 Voice Agent</h2>
      <p class="muted">输入中转服务配置的访问密钥（VOICE_API_KEY）。</p>
      <input id="api-key" type="password" autocomplete="off" required spellcheck="false" placeholder="访问密钥">
      <label class="check"><input id="remember" type="checkbox"> 在此浏览器中记住</label>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <button class="primary" type="submit">连接</button>
    </form>
  </section>

  <dialog id="rename-dialog" aria-labelledby="rename-title">
    <form method="dialog" id="rename-form">
      <h2 id="rename-title">重命名会话</h2>
      <input id="rename-input" type="text" maxlength="80" required autocomplete="off">
      <div class="dialog-actions">
        <button value="cancel" type="button" id="rename-cancel">取消</button>
        <button value="ok" class="primary" type="submit" id="rename-confirm">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title">删除会话？</h2>
    <p id="delete-name" class="delete-name"></p>
    <p class="muted">会删除中转服务中的对话和草稿，并同步删除 Hermes 中对应的会话。此操作无法撤销。</p>
    <div class="dialog-actions">
      <button id="delete-cancel" type="button" autofocus>取消</button>
      <button id="delete-confirm" class="danger-fill" type="button">删除</button>
    </div>
  </dialog>

  <dialog id="logs-dialog" class="logs-dialog" aria-labelledby="logs-title">
    <div class="logs-head">
      <button id="logs-back" class="icon-button" type="button" aria-label="返回列表" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h2 id="logs-title">设备诊断日志</h2>
      <button id="logs-close" class="icon-button" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p id="logs-note" class="muted logs-note">设备在录音失败、异常重启等情况下会自动上报最近的事件与日志。</p>
    <div id="logs-list" class="logs-list"></div>
    <pre id="logs-text" class="logs-text" hidden></pre>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
